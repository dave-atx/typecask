<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Over 2,000 fonts, free</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Fraunces:opsz,wght@9..144,800&amp;family=JetBrains+Mono:wght@700&amp;display=swap">
<style>
html, body { margin: 0; overflow: hidden; background: #141318; }
</style>
</head>
<body>
<div style="position: relative; width: 440px; height: 956px; overflow: hidden; background: #141318; color: #f7f5f0; font-family: -apple-system, 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif">
  <div style="position: absolute; left: 36px; right: 36px; top: 60px; display: flex; flex-direction: column; gap: 4px">
    <p style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Over 2,000</p>
    <div style="display: flex; flex-direction: column; line-height: 1">
      <div style="display: flex; align-items: flex-end; gap: 8px">
        <span style="font-family: 'Fraunces', Georgia, serif; font-weight: 800; font-size: 76px; letter-spacing: -0.03em">fonts</span>
        <span aria-hidden="true" style="display: block; width: 9px; height: 52px; margin-bottom: 8px; border-radius: 3px; background: #ff9f43"></span>
      </div>
      <span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 64px; color: rgba(247,245,240,0.6)">fonts</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 50px; letter-spacing: -0.02em; color: rgba(247,245,240,0.32)">fonts</span>
    </div>
    <p style="margin: 18px 0 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #ff9f43">100% free.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px">
      <span style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #26242e; box-shadow: inset 0 0 0 1px #3b3846; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"></path></svg>
        No subscriptions
      </span>
      <span style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #26242e; box-shadow: inset 0 0 0 1px #3b3846; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"></path></svg>
        No ads
      </span>
      <span style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: #26242e; box-shadow: inset 0 0 0 1px #3b3846; font-size: 15px; font-weight: 600">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"></path></svg>
        No data collected
      </span>
    </div>
  </div>
  <div style="position: absolute; left: 84px; top: 540px; width: 300px; height: 670px; box-sizing: border-box; padding: 8px; border-radius: 48px; background: #26242e; box-shadow: 0 0 0 1.5px #3b3846, 0 40px 80px rgba(0,0,0,0.6); transform: rotate(-4deg)">
    <img src="iphone-samples.png" alt="Typecask's All Fonts list, each family shown in its own face" style="display: block; width: 100%; border-radius: 40px">
  </div>
</div>
</body>
</html>
