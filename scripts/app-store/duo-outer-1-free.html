<!doctype html>
<html lang="en">

<style>

<body>
<div style="position: relative; width: 466px; height: 678px; overflow: hidden; background: #141318; color: #f7f5f0; font-family: -apple-system, 'SF Pro Display', system-ui, 'Helvetica Neue', Arial, sans-serif">
  <div style="position: absolute; left: 36px; right: 36px; top: 52px; display: flex; flex-direction: column; gap: 4px">

        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"></path></svg>

        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#ff9f43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"></path></svg>
