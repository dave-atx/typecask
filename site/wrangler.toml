# The site is static: Workers serves site/public and there's no Worker script to run.
#
# Deployed by .github/workflows/site.yml, which builds the catalog from the shipping app's tag
# first. Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repository's Actions secrets.

name = "typecask-site"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
# Serve Hugo's 404.html with a 404 status for anything that isn't a file.
not_found_handling = "404-page"
