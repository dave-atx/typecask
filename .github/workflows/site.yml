# Builds typecask.app and deploys it to Cloudflare Workers.
#
# The site shows the catalog the shipping app carries, not main's, so it rebuilds when a TestFlight
# build succeeds. Cloudflare Workers Builds only triggers on branch pushes, and this has to trigger
# on a testflight-N tag, which is why the build lives here instead. It also rebuilds daily to pick
# up the app's App Store rating.
#
# Needs these in the repository's Actions settings:
#   secrets.CLOUDFLARE_API_TOKEN    a token with Workers Scripts:Edit on the account below
#   secrets.CLOUDFLARE_ACCOUNT_ID   the Cloudflare account the Worker lives in
name: Site

on:
  workflow_run:
    workflows: [TestFlight]
    types: [completed]
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/site-catalog.sh
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - scripts/site-catalog.sh
      - .github/workflows/site.yml
  # Daily, so the App Store rating the home page shows doesn't wait for the next TestFlight build.
  schedule:
    # Every three hours, so a version Apple releases reaches the site the same day: site-catalog.sh
    # builds from the version the App Store has.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # To announce it in Discussions when a deploy moves the site to a new version.
  discussions: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cloudflare Workers Builds reads the same variable, if the build ever moves there.
  HUGO_VERSION: 0.170.0

jobs:
  site:
    # A TestFlight run that failed shipped no new build, so there's no new catalog to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Shallow: site-catalog.sh fetches the one tag it needs. The full history is a fonts release
      # of previews every week.
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          url="https://github.com/gohugoio/hugo/releases/download/v$HUGO_VERSION"
          curl -fsSL --retry 3 -o /tmp/hugo.deb \
            "$url/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Read the shipping app's catalog
        run: scripts/site-catalog.sh

      - name: Build
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --printPathWarnings

      # A page that didn't build is worth catching before Cloudflare serves it.
      - name: Check the build
        working-directory: site
        run: |
          casks=$(python3 -c 'import json; print(len(json.load(open("data/catalog.json"))["casks"]))')
          pages=$(find public -name '*.html' | wc -l)
          fonts=$(find public/p -type f | wc -l)
          echo "$casks casks: $pages pages, $fonts previews"
          # A page and a preview for each cask, plus the home, catalog, style and document pages. Counted
          # against the catalog, since a fonts release can drop casks: 2,130 failed a floor set at 2,193.
          if [ "$casks" -lt 1000 ] || [ "$pages" -le "$casks" ] || [ "$fonts" -lt "$casks" ]; then
            echo "The build is short; the catalog probably didn't load." >&2
            exit 1
          fi
          test -s public/index.html
          test -s public/fonts/index.html
          test -s public/sitemap.xml

      # Which version the live site shows, to say so when this deploy moves it to another.
      - name: Read the version the site shows
        if: github.event_name != 'pull_request'
        id: before
        run: |
          version=$(curl -fsS --max-time 20 https://typecask.app/release.json |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site

      # A discussion in Announcements with the version's release notes, which GitHub tells everyone watching
      # the repository about, its owner included: the fonts, What's New and anything gated on the version
      # changed with the App Store's release.
      - name: Announce the new version
        if: github.event_name != 'pull_request' && steps.before.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.before.outputs.version }}
        run: |
          after=$(python3 -c 'import json; print(json.load(open("site/data/release.json"))["version"])')
          if [ "$after" = "$BEFORE" ]; then
            exit 0
          fi
          body=$(AFTER="$after" python3 - << 'PY'
          import json, os
          version = os.environ["AFTER"]
          notes = next((entry["notes"] for entry in json.load(open("site/data/notes.json")) if entry["version"] == version), "")
          print(f"Typecask {version} is on the App Store.\n")
          if notes:
              print(notes.replace("• ", "- ") + "\n")
          print("[What's new](https://typecask.app/whats-new/) · [Download on the App Store](https://apps.apple.com/app/id6826936046)")
          PY
          )
          # The $s in single quotes are GraphQL's variables, not the shell's.
          # shellcheck disable=SC2016
          ids=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                id
                discussionCategory(slug: "announcements") { id }
              }
            }' --jq '.data.repository | "\(.id) \(.discussionCategory.id)"')
          # shellcheck disable=SC2016
          gh api graphql -F repository="${ids% *}" -F category="${ids#* }" -F title="Typecask $after" \
            -F body="$body" -f query='
            mutation($repository: ID!, $category: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}) {
                discussion { url }
              }
            }' --jq '.data.createDiscussion.discussion.url'
