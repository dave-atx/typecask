# Regenerates the list of Apple's fonts and their previews, which changes only with a new iOS.
#
# ApplePreviewRenderer runs in the simulator, where it lists iOS's built-in fonts, downloads each of
# the ones Settings offers, and renders an image of each. build-catalog.py apple-previews then subsets
# those downloads into preview fonts, which has to happen in the same job: the downloads are on this
# runner's simulator, and gone once it's erased. Opens a pull request with the result.
name: Apple fonts

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# pipefail, so a test run that fails ahead of a grep fails the step: without it, a runner that never
# started left the committed AppleFonts.json as it was, and the run reported nothing had changed.
defaults:
  run:
    shell: bash

jobs:
  previews:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      # As in fonts.yml: a first boot outlasts XCTest's patience ("Timed out waiting for AX loaded
      # notification"), so the simulator boots while the tests build, and they wait until it's done.
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          import itertools
          # com.apple.CoreSimulator.SimRuntime.iOS-27-2, or iOS-27-2-iPhone19-4 for a device-specific one.
          version = lambda runtime: [int(part) for part in itertools.takewhile(
              str.isdigit, runtime.rsplit("iOS-", 1)[1].split("-"))]
          for runtime in sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"] == "iPad Pro 11-inch (M5)":
                      print(device["udid"])
                      sys.exit()
          sys.exit("no iPad Pro 11-inch (M5) simulator")')
          xcrun simctl boot "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          # The project expects Fonts.xcassets, which is generated rather than committed; these
          # tests need no fonts in it.
          mkdir -p Typecask/Fonts.xcassets
          echo '{"info":{"author":"xcode","version":1}}' > Typecask/Fonts.xcassets/Contents.json
          xcodebuild build-for-testing -project Typecask.xcodeproj -scheme Typecask \
            -destination "$DESTINATION" -derivedDataPath DerivedData | tail -5

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR" -b

      - name: Render Apple's fonts in the simulator
        run: |
          TEST_RUNNER_TYPECASK_APPLE_FONTS_OUTPUT="$PWD/Typecask" xcodebuild test-without-building \
            -project Typecask.xcodeproj -scheme Typecask -destination "$DESTINATION" \
            -derivedDataPath DerivedData -only-testing:TypecaskUITests/ApplePreviewRenderer |
            grep -E "ApplePreviewRenderer:|TEST"

      - name: Subset the previews
        run: uv run --script scripts/build-catalog.py apple-previews

      - name: Open a pull request
        run: |
          branch="update-apple-fonts/$(date -u +%Y%m%d)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A Typecask/AppleFonts.json Typecask/ApplePreviews
          if git diff --cached --quiet; then
            echo "Apple's fonts are unchanged."
            exit 0
          fi
          git commit -q -m "Update Apple's fonts and their previews"
          git push -q origin "$branch"
          # Against the branch the run started from, so a branch's pipeline changes can be tried first.
          gh pr create --base "${{ github.ref_name }}" --title "Update Apple's fonts" \
            --body "Regenerated by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
