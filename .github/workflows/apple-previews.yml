# Regenerates the list of Apple's fonts and their previews, which changes only with a new iOS.
#
# ApplePreviewRenderer runs in the simulator, where it lists iOS's built-in fonts, downloads each of
# the ones Settings offers, and renders an image of each. build-catalog.py apple-previews then subsets
# those downloads into preview fonts, which has to happen in the same job: the downloads are on this
# runner's simulator, and gone once it's erased. Opens a pull request with the result.
name: Apple fonts

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  previews:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DESTINATION: platform=iOS Simulator,name=iPad Pro 11-inch (M5)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Render Apple's fonts in the simulator
        run: |
          # The project expects Fonts.xcassets, which is generated rather than committed; these
          # tests need no fonts in it.
          mkdir -p Typecask/Fonts.xcassets
          echo '{"info":{"author":"xcode","version":1}}' > Typecask/Fonts.xcassets/Contents.json
          TEST_RUNNER_TYPECASK_APPLE_FONTS_OUTPUT="$PWD/Typecask" xcodebuild test -project Typecask.xcodeproj \
            -scheme Typecask -destination "$DESTINATION" -derivedDataPath DerivedData \
            -only-testing:TypecaskUITests/ApplePreviewRenderer | grep -E "ApplePreviewRenderer:|TEST"

      - name: Subset the previews
        run: uv run --script scripts/build-catalog.py apple-previews

      - name: Open a pull request
        run: |
          branch="update-apple-fonts/$(date -u +%Y%m%d)-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A Typecask/AppleFonts.json Typecask/ApplePreviews
          if git diff --cached --quiet; then
            echo "Apple's fonts are unchanged."
            exit 0
          fi
          git commit -q -m "Update Apple's fonts and their previews"
          git push -q origin "$branch"
          # Against the branch the run started from, so a branch's pipeline changes can be tried first.
          gh pr create --base "${{ github.ref_name }}" --title "Update Apple's fonts" \
            --body "Regenerated by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
