# Archives Typecask with the fonts Typecask/FontsAsset.json pins and uploads it to TestFlight.
#
# The app is mostly fonts: 3.6 GB of them, in a thousand On-Demand Resources packs that have to be in
# the archive for Apple to host. So this archives once, exports once and uploads that, and spends most
# of its care on not running out of disk.
#
# Tag testflight-N and push it: N becomes CURRENT_PROJECT_VERSION, the build number TestFlight sees,
# and it has to be higher than any build already uploaded.
#
# Needs these in the repository's Actions settings:
#   vars.APPLE_TEAM_ID                       the ten-character team the app signs with
#   secrets.APPLE_DISTRIBUTION_CERT_P12      base64 of an Apple Distribution .p12
#   secrets.APPLE_DISTRIBUTION_CERT_PASSWORD the password that .p12 was exported with
#   secrets.APP_STORE_CONNECT_KEY_ID         an App Store Connect API key with App Manager access
#   secrets.APP_STORE_CONNECT_ISSUER_ID      that key's issuer
#   secrets.APP_STORE_CONNECT_PRIVATE_KEY    the key's .p8, contents and all
name: TestFlight

on:
  push:
    tags:
      - testflight-*
  workflow_dispatch:
    inputs:
      build:
        description: Build number, higher than any TestFlight has already seen
        required: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      # The image defaults to 27.1; releases are built with 27.2.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      # Fonts.xcassets is 3.6 GB, and the derived data, the archive and the export each hold their
      # own copy of it; Xcode's export pipeline stages a fourth. The spare Xcodes and the simulator
      # runtimes are the only things on the image big enough to make that room.
      - name: Make room on the disk
        run: |
          df -h / "$RUNNER_TEMP"
          # By resolved path: the image points more than one Xcode*.app at the same bundle, and
          # deleting the one DEVELOPER_DIR reaches through a symlink would take the toolchain with it.
          keep=$(cd "$DEVELOPER_DIR/../.." && pwd -P)
          echo "Keeping $keep"
          for app in /Applications/Xcode*.app; do
            [ "$(cd "$app" && pwd -P)" = "$keep" ] && continue
            echo "Removing $app"
            sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          rm -rf ~/Library/Developer/CoreSimulator/Devices
          df -h / "$RUNNER_TEMP"

      - name: Set the build number
        env:
          BUILD: ${{ inputs.build || github.ref_name }}
        run: scripts/set-build-number.sh "${BUILD#testflight-}"

      - name: Unpack the fonts
        env:
          TYPECASK_GITHUB_TOKEN: ${{ github.token }}
        run: scripts/fetch-fonts-asset.sh

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/typecask.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          # Long enough for the archive and the export, which together run well over an hour.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # tr because base64 wraps its output by default on some platforms and not others.
          printf %s "$CERT_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign stops at a prompt for the key, which nobody is here to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" \
            > /dev/null
          # Ahead of the login keychain, so xcodebuild looks in this one first.
          # shellcheck disable=SC2046 # the existing list is one keychain path per line.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Set up App Store Connect and Xcode's capability cache
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool finds the key in this directory by name; xcodebuild is told the path.
          mkdir -p ~/.appstoreconnect/private_keys
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "DEVELOPMENT_TEAM = $TEAM_ID" > Signing.local.xcconfig
          # Xcode matches entitlements to App ID capabilities with the portal's current list, which it
          # caches here. Without the folder it falls back to the list it ships with, where Font
          # Enumeration, a capability Apple grants on request, also claims user-fonts' system
          # installation value, and export fails trying to enable Font Enumeration on the App ID.
          mkdir -p ~/Library/Developer/Xcode/UserData/Capabilities

      - name: Archive
        run: |
          xcodebuild archive -project Typecask.xcodeproj -scheme Typecask \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Typecask.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates COMPILER_INDEX_STORE_ENABLE=NO \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -200 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          # Another copy of every font, and the export needs the space more than a finished build does.
          rm -rf "$RUNNER_TEMP/DerivedData"
          df -h /

      - name: Export for the App Store
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <!-- set-build-number.sh already wrote it; letting Xcode pick would ignore the tag. -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Typecask.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -200 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/export.log"
          # The .ipa is all the upload reads, and it is the smaller half of what's on the disk.
          rm -rf "$RUNNER_TEMP/Typecask.xcarchive"
          ls -lh "$RUNNER_TEMP/export"
          df -h /

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Typecask.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # The archive and export logs are the only record of a failure, and they're far too big to read
      # in the job log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs
          retention-days: 7
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log

      - name: Forget the signing certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/typecask.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys
