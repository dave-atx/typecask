# Archives Typecask with the fonts Typecask/FontsAsset.json pins and uploads it to TestFlight.
#
# Tag testflight-N and push it: N becomes CURRENT_PROJECT_VERSION, the build number TestFlight sees,
# and it has to be higher than any build already uploaded.
#
# Signing is manual, and deliberately so. Given an App Store Connect API key, automatic signing goes
# looking for cloud-managed distribution certificates, which an API key has no access to; testflight-4
# archived with a development certificate the key minted on the spot and then couldn't export at all.
# So the archive is signed ad-hoc and the export re-signs it with the certificate and profile below.
#
# Needs these in the repository's Actions settings:
#   vars.APPLE_TEAM_ID                       the ten-character team the app signs with
#   secrets.APPLE_DISTRIBUTION_CERT_P12      base64 of an Apple Distribution .p12, with its key
#   secrets.APPLE_DISTRIBUTION_CERT_PASSWORD the password that .p12 was exported with
#   secrets.APPLE_PROVISIONING_PROFILE       base64 of the App Store .mobileprovision for the App ID
#   secrets.APP_STORE_CONNECT_KEY_ID         an App Store Connect API key with App Manager access
#   secrets.APP_STORE_CONNECT_ISSUER_ID      that key's issuer
#   secrets.APP_STORE_CONNECT_PRIVATE_KEY    the key's .p8, contents and all
name: TestFlight

on:
  push:
    tags:
      - testflight-*
  workflow_dispatch:
    inputs:
      build:
        description: Build number, higher than any TestFlight has already seen
        required: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      # The image defaults to 27.1; releases are built with 27.2.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      # Signing first, and checked before anything slow: xcodebuild resolves it at the end of the
      # export, so a bad certificate or profile otherwise takes an hour to report itself.
      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/typecask.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          # Longer than the archive and the export together.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # tr because base64 wraps its output by default on some platforms and not others.
          printf %s "$CERT_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign stops at a prompt for the key, which nobody is here to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" \
            > /dev/null
          # Ahead of the login keychain, so xcodebuild looks in this one first.
          # shellcheck disable=SC2046 # the existing list is one keychain path per line.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Set up App Store Connect and the signing team
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool finds the key in this directory by name.
          mkdir -p ~/.appstoreconnect/private_keys
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "DEVELOPMENT_TEAM = $TEAM_ID" > Signing.local.xcconfig
          # Xcode matches entitlements to App ID capabilities with the portal's current list, which it
          # caches here. Without the folder it falls back to the list it ships with, where Font
          # Enumeration, a capability Apple grants on request, also claims user-fonts' system
          # installation value, and export fails trying to enable Font Enumeration on the App ID.
          mkdir -p ~/Library/Developer/Xcode/UserData/Capabilities

      - name: Prepare the export
        env:
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          printf %s "$PROFILE" | tr -d '[:space:]' | base64 --decode \
            > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/typecask.keychain-db" \
            scripts/prepare-export.sh "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/ExportOptions.plist"

      - name: Set the build number
        env:
          BUILD: ${{ inputs.build || github.ref_name }}
        run: scripts/set-build-number.sh "${BUILD#testflight-}"

      - name: Unpack the fonts
        run: scripts/fetch-fonts-asset.sh

      # App Store Connect rejects the whole upload for one font that fails its validation, and says so
      # only by email after the archive, export and upload, so the same check runs here first.
      - name: Check the fonts
        run: scripts/check-fonts.sh

      # Ad-hoc, so nothing reaches for a distribution certificate here and the API key mints nothing.
      # The export re-signs every asset pack anyway.
      - name: Archive
        run: |
          log="$RUNNER_TEMP/archive.log"
          scripts/run-with-heartbeat.sh "$log" \
            xcodebuild archive -project Typecask.xcodeproj -scheme Typecask \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Typecask.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            || { tail -200 "$log"; exit 1; }
          grep -E "Signing Identity|^\*\*" "$log" || true
          # Another copy of every font, and the export needs the room more than a finished build does.
          rm -rf "$RUNNER_TEMP/DerivedData"

      - name: Export for the App Store
        run: |
          log="$RUNNER_TEMP/export.log"
          status=0
          scripts/run-with-heartbeat.sh "$log" \
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Typecask.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            || status=$?
          # xcodebuild's own output is a handful of lines; the step-by-step detail is all in the
          # bundle it names on its first line. It puts that in the Darwin per-user temp directory,
          # which TMPDIR doesn't move, so the path is read back rather than chosen.
          bundle=$(sed -n 's/.*Created bundle at path "\(.*\)".*/\1/p' "$log" | head -1)
          if [ -d "$bundle" ]; then
            mkdir -p "$RUNNER_TEMP/xcdistributionlogs"
            cp -R "$bundle" "$RUNNER_TEMP/xcdistributionlogs/"
            echo "Kept $(basename "$bundle")"
          fi
          if [ "$status" -ne 0 ]; then
            tail -200 "$log"
            exit "$status"
          fi
          tail -5 "$log"
          # The .ipa is all the upload reads, and the archive is the larger half of the two.
          rm -rf "$RUNNER_TEMP/Typecask.xcarchive"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/export/Typecask.ipa" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # xcodebuild says little on its own, so a failure is only diagnosable from these.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs
          retention-days: 7
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/xcdistributionlogs/

      - name: Forget the signing certificate
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/typecask.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys ~/Library/MobileDevice/Provisioning\ Profiles
